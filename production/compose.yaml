# Frozen from the inspected TP9 production environment; see source-lock.json.
name: kimi-k3-qsrt
services:
  kimi:
    image: ${KIMI_IMAGE:-ghcr.io/myshytf/kimi-k3:runtime-20260918}
    build:
      context: .
    pull_policy: never
    platform: linux/amd64
    command: []
    entrypoint: ["/bin/bash", "/runtime/entrypoint.sh"]
    depends_on:
      shm-preflight:
        condition: service_completed_successfully
    network_mode: host
    ipc: host
    restart: unless-stopped
    security_opt: ["label=disable"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ulimits:
      memlock: -1
      stack: 67108864
      core: 0
      nofile:
        soft: 1048576
        hard: 1048576
    environment:
      B12X_COMPILE_CACHE_DIR: "/cache/tp9-colocated-prod/6e5fff3911585dfd/b12x/compile"
      B12X_CUTE_COMPILE_CACHE_DIR: "/cache/tp9-colocated-prod/6e5fff3911585dfd/b12x/cute"
      B12X_DENSE_NARROW_SPLITK_MAX: "8"
      B12X_DENSE_SPLITK_TURBO: "0"
      B12X_DIRECT_DYNAMIC_LAUNCH: "1"
      B12X_DYNAMIC_TILE_MN: "64x128"
      B12X_MLA_SM120_BALANCED_WAVES: "1"
      B12X_MLA_SM120_GLM_FASTPATH: "1"
      B12X_MLA_SM120_GLM_W_HW_DEQUANT: "0"
      B12X_MOE_PLAN_CACHE_SIZE: "8192"
      B12X_MOE_WORKSPACE_TOKEN_LIMIT: "1536"
      B12X_PCIE_ALLREDUCE_ALGORITHM: "auto"
      B12X_PCIE_DCP_A2A_TRANSPORT: "push"
      B12X_PCIE_DCP_GATHER_GROUPS: "${K3_PCIE_GROUPS:-0,1,2,3,8;4,5,6,7}"
      B12X_PCIE_DMA_GRAPH_REPLAY: "1"
      B12X_PCIE_DMA_GRAPH_REPLAY_MAX_ENTRIES: "4"
      B12X_PCIE_DMA_GRAPH_REPLAY_MIN_BYTES: "8388608"
      B12X_PCIE_DMA_PIPELINED_GATHER: "0"
      B12X_PCIE_DMA_THREADS: "128"
      B12X_PCIE_RING_FP32_HOPS: "1"
      B12X_PCIE_RING_GRANULE_ROWS: "128"
      B12X_PCIE_TP9_STATIC_PEERS: "1"
      B12X_SOURCE_DIR: "/opt/venv/lib/python3.12/site-packages"
      B12X_SQG_XOR_CHEB_T12_DECODE_CHAIN: "funnel"
      B12X_SQG_XOR_CHEB_T12_DIRECT_SMEM: "1"
      B12X_W4A16_CROSS_TILE_PREFETCH: "1"
      B12X_W4A16_FUSED_COOPERATIVE: "0"
      B12X_W4A16_FUSED_SM_RESERVE: "2"
      B12X_W4A16_GROUP_BUILDER_INLINE: "1"
      B12X_W4A16_GROUP_TASK_CURSOR: "1"
