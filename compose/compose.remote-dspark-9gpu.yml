services:
  kimi-k3-draft:
    # Dedicated DSpark3 draft on the 9th GPU (bus 09:00.0, RTX PRO 6000
    # Workstation Edition, SM 12.0 — the standalone runtime ships sm_120
    # binaries). Qualified multi-method standalone runtime image.
    image: kimi-k3-dspark-3090:bf16-cudagraph
    container_name: kimi-k3-draft
    restart: unless-stopped
    network_mode: host
    ipc: host
    security_opt:
      - label=disable
    ulimits:
      memlock: -1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
    volumes:
      - /mnt/models/Kimi-K3-DSpark-Inferact-BF16:/draft-model:ro
      - /mnt/models/Kimi-K3-QSRT-K2:/target-weights:ro
      - /mnt/models/kimi-k3-draft3090-cache:/cache:rw
      - /home/g0san/kimi-k3-production/bin/patch-dspark-standalone-grouped-op-gate.py:/usr/local/bin/patch-dspark-standalone-grouped-op-gate.py:ro
      - /home/g0san/kimi-k3-production/bin/entrypoint-draft-9thgpu.sh:/usr/local/bin/entrypoint-draft-9thgpu.sh:ro
    entrypoint:
      - /usr/local/bin/entrypoint-draft-9thgpu.sh
    # DSpark depth 3 aligned with the issue-75 target: 4 sequences reserve
    # (3-1) x 4 = 8 lookahead slots; 1,544 total - 8 = 1,536 scheduled keeps
    # the 1,536-token recurrent boundary.
    command:
      - "--draft-model"
      - "/draft-model"
      - "--target-weights"
      - "/target-weights"
      - "--target-config"
      - "/opt/k3-dspark-3090/target-config"
      - "--method"
      - "dspark"
      - "--device"
      - "0"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8091"
      - "--num-speculative-tokens"
      - "3"
      - "--max-model-len"
      - "372000"
      - "--max-num-batched-tokens"
      - "1544"
      - "--max-num-seqs"
      - "4"
      - "--max-retained-requests"
      - "8"
      - "--draft-kv-cache-gib"
      - "3"
      - "--draft-kv-window"
      - "32768"
      - "--enable-cuda-graph"
      - "--cuda-graph-warmups"
      - "2"
      - "--proposal-address"
      - "tcp://127.0.0.1:8092"
    stop_grace_period: 30s

  kimi-k3-production:
    # 9-GPU remote-DSpark profile: TP8/DCP8 target on the eight Max-Q GPUs
    # (buses 0c..1e), DSpark3 draft on the dedicated 9th GPU via protocol-v2
    # ZMQ loopback. Removing the colocated draft frees ~1.2 GiB/rank, which
    # funds a 3.0 GiB/rank KV reservation (~1.08M tokens, 2.9x one 372K
    # request) versus 786,717 tokens for TP8-colocated.
    image: kimi-k3-production-issue75-dspark@sha256:f18184728c27959de26cf11952d7a8b96e57b513a6badf8bf3e09fd4cda16a76
    container_name: kimi-k3-production
    restart: unless-stopped
    depends_on:
      kimi-k3-draft:
        condition: service_started
    network_mode: host
    ipc: host
    security_opt:
      - label=disable
    ulimits:
      memlock: -1
      stack: 67108864
      nofile:
        soft: 1048576
        hard: 1048576
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      # Indices 1..8 = buses 0c,0d,10,11,19,1a,1d,1e (the validated TP8/DCP8
      # rank order). Index 0 (bus 09) belongs to the draft container.
      CUDA_VISIBLE_DEVICES: "1,2,3,4,5,6,7,8"
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
      MODEL: /model
      DRAFT_MODEL: /draft-model
      PORT: "8090"
      TP_SIZE: "8"
      DCP_SIZE: "8"
      SERVED_MODEL_NAME: Kimi-K3
      MAX_MODEL_LEN: "372000"
      # Colocated-equivalent scheduler geometry: 1536 target slots + 4 x 2
      # lookahead slots.
      MAX_NUM_BATCHED_TOKENS: "1544"
      MAX_NUM_SCHEDULED_TOKENS: "1536"
      MAX_NUM_SEQS: "4"
      # Remote draft frees the colocated draft share; 3.0 GiB/rank booted
      # but left only 18-52 MiB free (CUBLAS-crash zone, 2026-08-16 lesson).
      # 2.75 GiB keeps ~300 MiB headroom and still ~1.12M tokens (3.0x).
      KV_CACHE_MEMORY_BYTES: "2952790016"
      GPU_MEMORY_UTILIZATION: "0.985"
      MAMBA_BLOCK_SIZE: "1536"
      PREFIX_MATCH_UNIT: "1536"
      ENABLE_VISION: "0"
      VLLM_DCP_SHARD_DRAFT: "0"
      # Remote DSpark proposal RPC on the dedicated draft GPU.
      VLLM_K3_DRAFT_REMOTE_ADDRESS: tcp://127.0.0.1:8092
      VLLM_K3_DRAFT_REMOTE_TIMEOUT_MS: "30000"
      VLLM_K3_DRAFT_TIMING_LOG_INTERVAL: "32"
      B12X_MOE_WORKSPACE_TOKEN_LIMIT: "4096"
      B12X_W4A16_STABLE_ROUTE_PACK: "1"
      B12X_W4A16_PREFILL_FUSED_SUM: "1"
      VLLM_FLASHINFER_WORKSPACE_BUFFER_SIZE: "0"
      VLLM_COMPUTE_NANS_IN_LOGITS: "1"
      # ws8 target keeps the tuned FlashInfer PCIe IPC all-reduce.
      KIMI_PCIE_ALLREDUCE_BACKEND: flashinfer-ipc
      FLASHINFER_AUTOTUNE_DIR: /opt/pcie-pr-audit/autotune
      VLLM_PCIE_ONESHOT_ALLREDUCE_MAX_SIZE: "112KB"
      VLLM_PCIE_ONESHOT_FUSED_ADD_RMS_NORM_MAX_SIZE: "112KB"
      VLLM_SERVER_DEV_MODE: "1"
      # Fine-object protocol: 1,536 global tokens per LMCache object, 192
      # attention rows/rank. NEW producer namespace: remote-DSpark object
      # geometry is incompatible with colocated namespaces (2026-08-21
      # poisoning lesson — same hashes, different sizes).
      LMCACHE_MODE: disk
      LMCACHE_TRANSFER_MODE: engine_driven
      LMCACHE_EXPECTED_SOURCE_ROOT: /opt/infernal-invocation/lmcache
      LMCACHE_SEPARATE_OBJECT_GROUPS: "1"
      LMCACHE_SERVER_ENV: "CUDA_VISIBLE_DEVICES= CUDA_MODULE_LOADING=LAZY PYTHONPATH=/opt/infernal-invocation/b12x:/opt/infernal-invocation/vllm"
      LMCACHE_SHM_NAME: kimik3_remote9g_dcp8_k3_fine1536_l1_48g_v1
      LMCACHE_CHUNK_SIZE: "1536"
      LMCACHE_L1_INIT_GB: "48"
      LMCACHE_L1_GB: "48"
      LMCACHE_L2_PREFETCH_MAX_IN_FLIGHT: "1"
      LMCACHE_L2_PATH: /lmcache/l2
      LMCACHE_L2_GB: "512"
      LMCACHE_L2_WORKERS: "4"
      LMCACHE_MAX_GPU_WORKERS: "8"
      LMCACHE_MAX_CPU_WORKERS: "4"
      LMCACHE_PORT: "5555"
      LMCACHE_HTTP_PORT: "8088"
      LMCACHE_START_TIMEOUT: "120"
      LMCACHE_LOG: /tmp/lmcache-mp-8090.log
      LMCACHE_HEARTBEAT_INTERVAL: "5"
      LMCACHE_WORKER_REAP_TIMEOUT: "120"
      LMCACHE_WORKER_REGISTRATION_GRACE: "86400"
      LMCACHE_KV_LOAD_FAILURE_POLICY: recompute
    volumes:
      - /mnt/models/Kimi-K3-QSRT-K2:/model:ro
      - /mnt/models/Kimi-K3-DSpark-Inferact-BF16:/draft-model:ro
      - /mnt/models/kimi-k3-production-cache:/cache:rw
      - /home/g0san/kimi-k3-production/autotune/pcie_ipc_all_reduce_ws8.json:/opt/pcie-pr-audit/autotune/pcie_ipc_all_reduce_ws8.json:ro
      - /mnt/lmcache-l2/kimik3/l2-remote-dspark-9gpu-k3-fine1536-v1:/lmcache/l2:rw
      - /home/g0san/kimi-k3-production/bin/entrypoint-aliases-remote-dspark-r29-fine1536.sh:/usr/local/bin/entrypoint-aliases-remote-dspark-r29-fine1536.sh:ro
      - /home/g0san/kimi-k3-production/bin/serve-kimi-k3-issue75-dspark-k3-dcp8.sh:/usr/local/bin/serve-kimi-k3-issue75-dspark-k3-dcp8.sh:ro
      - /home/g0san/kimi-k3-production/bin/entrypoint-issue75-colocated-dspark-k3-dcp8.sh:/usr/local/bin/entrypoint-issue75-colocated-dspark-k3-dcp8.sh:ro
      - /home/g0san/kimi-k3-production/bin/patch-lmcache-mla-only.py:/usr/local/bin/patch-lmcache-mla-only.py:ro
    entrypoint:
      - /usr/local/bin/entrypoint-issue75-colocated-dspark-k3-dcp8.sh
